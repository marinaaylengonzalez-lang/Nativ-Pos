<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a3fa0">
<title>Nativ POS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --r-sm:12px;--r-md:18px;--r-lg:24px;--r-pill:99px;
  --ink-900:#14171f;--ink-700:#4b5160;--ink-500:#969cab;--ink-300:#d6d9e1;--ink-100:#f2f3f6;--ink-0:#fff;
  --brand:#1a3fa0;--brand-deep:#0d2570;--brand-soft:#eaeefb;
  --money:#0f9d58;--money-deep:#0a7a43;--money-soft:#e6f7ee;
  --danger:#e0293f;--danger-soft:#fdeaed;
  --warn:#d97a06;--warn-soft:#fef3e2;
  --shadow-card:0 1px 2px rgba(20,23,31,.04),0 2px 8px rgba(20,23,31,.06);
  --shadow-float:0 8px 24px rgba(20,23,31,.12),0 2px 6px rgba(20,23,31,.06);
  --shadow-cta:0 10px 24px rgba(15,157,88,.35);
  --ease:cubic-bezier(.22,.85,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;background:var(--ink-100);color:var(--ink-900);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{max-width:430px;margin:0 auto;height:100vh;background:var(--ink-100);position:relative;display:flex;flex-direction:column;overflow:hidden}
input,select,textarea{border:1.5px solid var(--ink-300);border-radius:var(--r-sm);padding:12px 14px;width:100%;font-size:15px;background:#fff;color:var(--ink-900);outline:none;transition:border-color .15s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
button{font-family:inherit;cursor:pointer}
.lbl{font-size:13px;color:var(--ink-700);font-weight:700;display:block;margin-bottom:6px}
.field{margin-bottom:14px}
.btn-primary{width:100%;padding:16px;background:var(--brand);color:#fff;border:none;border-radius:var(--r-md);font-size:16px;font-weight:800;box-shadow:0 10px 24px rgba(26,63,160,.3);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s var(--ease)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.4;box-shadow:none}
.btn-money{width:100%;padding:16px;background:var(--money);color:#fff;border:none;border-radius:var(--r-md);font-size:16px;font-weight:800;box-shadow:var(--shadow-cta);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost{width:100%;padding:12px;background:none;border:none;color:var(--brand);font-size:14px;font-weight:700}
.btn-danger-ghost{width:100%;padding:12px;background:none;border:1.5px solid var(--danger);color:var(--danger);border-radius:var(--r-md);font-size:14px;font-weight:700}
.card{background:var(--ink-0);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:var(--r-sm);padding:11px 13px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade{animation:fadeIn .2s var(--ease)}
.center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
/* Scrollbars ocultos en mobile look */
::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="app"></div>








<script type="module">
import * as DB from './src/db.js';

const A = '#1a3fa0', R2 = '#e0293f', MONEY = '#0f9d58';
const LOGO_ICO = `<svg width="32" height="32" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#1a3fa0"/><polygon points="18,80 18,20 30,20 58,56 58,20 72,20 72,80 58,80 30,44 30,80" fill="white"/><polygon points="18,20 30,20 44,42 30,42" fill="#e0293f"/></svg>`;
const LOGO_BIG = `<svg width="64" height="64" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#1a3fa0"/><polygon points="18,80 18,20 30,20 58,56 58,20 72,20 72,80 58,80 30,44 30,80" fill="white"/><polygon points="18,20 30,20 44,42 30,42" fill="#e0293f"/></svg>`;

// ── ESTADO GLOBAL ────────────────────────────────────────────
let S = window.S = {
  loading: true,
  error: '',
  negocio: null,
  empleados: [],
  empleadoActivo: null,   // {id,nombre,rol} — null = dueño operando directo
  turno: null,
  productos: [],
  categorias: [],
  clientes: [],
  mesas: [],

  tab: 'vender',           // vender | mesas | caja | mas
  masScreen: null,         // null = menú "más" | 'productos' | 'clientes' | 'reportes' | 'finanzas' | 'config' | 'empleados'
  itemsListos: {},         // { mesaId: count } — items marcados listos por cocina
  pollTimer: null,         // referencia al setInterval de polling

  // PIN
  pinSel: null, pinBuffer: '', pinError: '',

  // Vender
  cart: {}, fcat: 'Todos', fq: '', sheet: null,
  disc: 0, nota: '',
  pm: 'efectivo', cstep: 'metodo', cash: '',
  selCliente: null, csq: '',

  // Mesas
  mesaSel: null, mesaView: 'mapa', mesaZona: 'Salón', mesaAddView: false, mesaFq: '',
  mesaCobrarSheet: false, mesaPM: 'efectivo', mesaCash: '',
};

function R(){ window.S = S; document.getElementById('app').innerHTML = render(); afterRender(); }
window.R = R;

const f$ = n => '$' + (Math.round(n) || 0).toLocaleString('es-AR');

// ── BOOT ──────────────────────────────────────────────────────
// ── SONIDO Y POLLING (mesero) ────────────────────────────────
function sonarAlerta(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.3);
    });
  } catch(e){}
}

async function pollItemsListos(){
  if(!S.negocio || !S.turno) return;
  try {
    const { data } = await DB.sb.from('pedidos_mesa')
      .select('mesa_id, estado')
      .eq('negocio_id', S.negocio.id)
      .eq('estado', 'listo');

    const conteo = {};
    (data || []).forEach(p => { conteo[p.mesa_id] = (conteo[p.mesa_id] || 0) + 1; });

    // Detectar si apareció algo nuevo que antes no estaba
    const hayNuevo = Object.entries(conteo).some(([mid, cnt]) => (S.itemsListos[mid] || 0) < cnt);
    if(hayNuevo) sonarAlerta();

    const cambio = JSON.stringify(conteo) !== JSON.stringify(S.itemsListos);
    S.itemsListos = conteo;
    if(cambio && S.tab === 'mesas') R(); // solo re-render si estamos en la pantalla de mesas
  } catch(e){}
}

async function boot(){
  try {
    const user = await DB.getSessionUser();
    if(!user){ window.location.href = './auth.html'; return; }

    const negocio = await DB.getMiNegocio();
    if(!negocio){ window.location.href = './auth.html'; return; }
    S.negocio = negocio;

    const [empleados, productos, categorias, clientes, mesas, turno] = await Promise.all([
      DB.listarEmpleados(negocio.id),
      DB.listarProductos(negocio.id),
      DB.listarCategorias(negocio.id),
      DB.listarClientes(negocio.id),
      DB.listarMesas(negocio.id),
      DB.turnoAbierto(negocio.id),
    ]);
    S.empleados = empleados;
    S.productos = productos;
    S.categorias = categorias.length ? categorias : [{ id: null, nombre: 'General', color: '#B5D4F4' }];
    S.clientes = clientes;
    S.mesas = mesas;
    S.turno = turno;

    // Si no hay empleados creados, el dueño entra directo sin PIN.
    if(empleados.length === 0){
      S.empleadoActivo = {
        id: null,
        nombre: negocio.nombre_dueno || 'Dueño',
        rol: 'dueno'
      };
    }

    S.loading = false;
    R();

    // Arrancar polling de items listos (para que el mesero vea alertas)
    if(S.pollTimer) clearInterval(S.pollTimer);
    S.pollTimer = setInterval(pollItemsListos, 15000);

  } catch(e) {
    console.error('[Nativ POS] Error en boot:', e);
    S.loading = false;
    S.error = 'Error al cargar: ' + e.message;
    R();
  }
}

boot();

// ════════════════════════════════════════════════════════════
// RENDER PRINCIPAL
// ════════════════════════════════════════════════════════════
function render(){
  if(S.loading) return renderLoading();
  if(S.error) return renderLoading(); // muestra el error con botón reintentar
  if(S.empleados.length > 0 && !S.empleadoActivo) return renderPIN();
  if(!S.empleadoActivo) {
    // Fallback: si por algún motivo empleadoActivo es null, forzar como dueño
    S.empleadoActivo = { id: null, nombre: S.negocio?.nombre_dueno || 'Dueño', rol: 'dueno' };
  }
  if(!S.turno) return renderAbrirTurno();

  let body = '';
  if(S.tab === 'vender') body = renderVender();
  else if(S.tab === 'mesas') body = renderMesas();
  else if(S.tab === 'caja') body = renderCaja();
  else if(S.tab === 'mas') body = renderMas();

  return `<div style="display:flex;flex-direction:column;height:100%">${body}${renderTabBar()}</div>`;
}

function renderLoading(){
  if(S.error) return `<div class="center-screen">${LOGO_BIG}
    <div style="margin-top:16px;font-size:13px;color:var(--danger);font-weight:700;text-align:center;max-width:280px">${S.error}</div>
    <button onclick="window.location.reload()" style="margin-top:16px;padding:10px 20px;background:var(--brand);color:#fff;border:none;border-radius:99px;font-size:13px;font-weight:700">Reintentar</button>
  </div>`;
  return `<div class="center-screen">${LOGO_BIG}<div style="margin-top:16px;font-size:14px;color:var(--ink-500);font-weight:700">Cargando Nativ POS...</div></div>`;
}

// ════════════════════════════════════════════════════════════
// PIN DE EMPLEADOS
// ════════════════════════════════════════════════════════════
function renderPIN(){
  const sel = S.pinSel;
  if(!sel){
    return `<div class="center-screen fade" style="justify-content:flex-start;padding-top:60px">
      ${LOGO_BIG}
      <div style="font-size:18px;font-weight:800;margin:16px 0 4px">¿Quién está usando la caja?</div>
      <div style="font-size:13px;color:var(--ink-500);margin-bottom:24px">${S.negocio.nombre}</div>
      <div style="width:100%;display:flex;flex-direction:column;gap:10px">
        ${S.empleados.map(e => `
          <div onclick="selectPinUser('${e.id}')" class="card" style="display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer">
            <div style="width:44px;height:44px;border-radius:50%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--brand)">${e.nombre.charAt(0).toUpperCase()}</div>
            <div><div style="font-size:15px;font-weight:700">${e.nombre}</div><div style="font-size:12px;color:var(--ink-500);font-weight:600">${rolLabel(e.rol)}</div></div>
          </div>`).join('')}
        <div onclick="selectPinUser('owner')" class="card" style="display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;border:1.5px dashed var(--ink-300);box-shadow:none">
          <div style="width:44px;height:44px;border-radius:50%;background:var(--ink-100);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--ink-500)"><i class="ti ti-crown"></i></div>
          <div><div style="font-size:15px;font-weight:700">Soy el dueño</div><div style="font-size:12px;color:var(--ink-500);font-weight:600">Acceso completo</div></div>
        </div>
      </div>
    </div>`;
  }

  if(sel === 'owner'){
    // El dueño entra directo sin PIN (ya tiene su sesión de Supabase Auth)
    S.empleadoActivo = { id: null, nombre: 'Dueño', rol: 'dueno' };
    R();
    return renderLoading();
  }

  const emp = S.empleados.find(e => e.id === sel);
  return `<div class="center-screen fade">
    <div style="width:56px;height:56px;border-radius:50%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:var(--brand);margin-bottom:12px">${emp?.nombre.charAt(0).toUpperCase()}</div>
    <div style="font-size:16px;font-weight:800;margin-bottom:4px">${emp?.nombre}</div>
    <div style="font-size:12px;color:var(--ink-500);margin-bottom:18px">Ingresá tu PIN</div>
    ${S.pinError ? `<div class="err"><i class="ti ti-alert-circle"></i>${S.pinError}</div>` : ''}
    <div style="display:flex;gap:11px;margin-bottom:22px">
      ${[0,1,2,3].map(i => `<div style="width:15px;height:15px;border-radius:50%;background:${i < S.pinBuffer.length ? A : 'var(--ink-300)'}"></div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:260px">
      ${[1,2,3,4,5,6,7,8,9].map(d => `<button onclick="pinPress('${d}')" style="height:58px;border-radius:16px;border:1.5px solid var(--ink-100);background:var(--ink-0);font-size:22px;font-weight:700;box-shadow:var(--shadow-card)">${d}</button>`).join('')}
      <div></div>
      <button onclick="pinPress('0')" style="height:58px;border-radius:16px;border:1.5px solid var(--ink-100);background:var(--ink-0);font-size:22px;font-weight:700;box-shadow:var(--shadow-card)">0</button>
      <button onclick="pinDelete()" style="height:58px;border-radius:16px;border:none;background:none;font-size:20px;color:var(--ink-500)"><i class="ti ti-backspace"></i></button>
    </div>
    <button class="btn-ghost" style="margin-top:18px" onclick="S.pinSel=null;S.pinBuffer='';S.pinError='';R()">Volver</button>
  </div>`;
}

function rolLabel(rol){
  return rol === 'dueno' ? 'Dueño' : rol === 'cajero' ? 'Cajero' : rol === 'mesero' ? 'Mesero' : rol;
}

window.selectPinUser = function(id){ S.pinSel = id; S.pinBuffer=''; S.pinError=''; R(); };

window.pinPress = async function(d){
  if(S.pinBuffer.length >= 4) return;
  S.pinBuffer += d;
  R();
  if(S.pinBuffer.length === 4){
    const result = await DB.validarPinEmpleado(S.negocio.id, S.pinSel, S.pinBuffer);
    if(result){
      S.empleadoActivo = result;
      S.pinSel = null; S.pinBuffer=''; S.pinError='';
      R();
    } else {
      S.pinError = 'PIN incorrecto';
      S.pinBuffer = '';
      R();
      setTimeout(()=>{ S.pinError=''; R(); }, 1800);
    }
  }
};
window.pinDelete = function(){ S.pinBuffer = S.pinBuffer.slice(0,-1); R(); };

// ════════════════════════════════════════════════════════════
// ABRIR TURNO
// ════════════════════════════════════════════════════════════
function renderAbrirTurno(){
  return `<div class="center-screen fade">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--warn-soft);display:flex;align-items:center;justify-content:center;margin-bottom:16px"><i class="ti ti-clock" style="font-size:28px;color:var(--warn)"></i></div>
    <div style="font-size:19px;font-weight:800;margin-bottom:4px">Abrí tu turno</div>
    <div style="font-size:13px;color:var(--ink-500);margin-bottom:24px">${S.negocio.nombre} · ${S.empleadoActivo?.nombre}</div>
    <div class="field" style="width:100%">
      <label class="lbl">Efectivo en caja al inicio</label>
      <input id="at-monto" type="text" inputmode="decimal" placeholder="$0" style="font-size:20px;font-weight:700">
    </div>
    <button class="btn-primary" onclick="doAbrirTurno()"><i class="ti ti-clock-play"></i> Abrir turno</button>
  </div>`;
}

window.doAbrirTurno = async function(){
  const monto = parseFloat(document.getElementById('at-monto').value) || 0;
  const { data, error } = await DB.abrirTurno(S.negocio.id, S.empleadoActivo.id, monto);
  if(!error){ S.turno = data; R(); }
};

// ════════════════════════════════════════════════════════════
// TAB BAR
// ════════════════════════════════════════════════════════════
function renderTabBar(){
  const rol = S.empleadoActivo?.rol;
  const tabs = [
    { id: 'vender', icon: 'ti-shopping-cart', label: 'Vender', show: rol !== 'mesero' },
    { id: 'mesas', icon: 'ti-armchair', label: 'Mesas', show: S.negocio.rubro === 'restaurante' },
    { id: 'caja', icon: 'ti-clock', label: 'Caja', show: rol !== 'mesero' },
    { id: 'mas', icon: 'ti-grid-dots', label: 'Más', show: true },
  ].filter(t => t.show);

  return `<div style="display:flex;background:#fff;border-top:1px solid var(--ink-100);padding:8px var(--sp-2) calc(8px + env(safe-area-inset-bottom))">
    ${tabs.map(t => `
      <div onclick="goTab('${t.id}')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;position:relative;cursor:pointer">
        <i class="ti ${t.icon}" style="font-size:23px;color:${S.tab===t.id ? A : 'var(--ink-500)'}"></i>
        <span style="font-size:11px;font-weight:700;color:${S.tab===t.id ? A : 'var(--ink-500)'}">${t.label}</span>
        ${S.tab===t.id ? `<div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:99px;background:${A}"></div>` : ''}
      </div>`).join('')}
  </div>`;
}

window.goTab = function(tab){ S.tab = tab; S.masScreen = null; R(); };

// ════════════════════════════════════════════════════════════
// HEADER reutilizable
// ════════════════════════════════════════════════════════════
function header(title, opts = {}){
  const { back = null, right = '' } = opts;
  return `<div style="padding:16px var(--sp-4) 12px;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--ink-100)">
    ${back ? `<button onclick="${back}" style="width:38px;height:38px;border-radius:99px;background:var(--ink-100);border:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-700)"><i class="ti ti-arrow-left"></i></button>` : `${LOGO_ICO}`}
    <span style="font-size:17px;font-weight:800;flex:1">${title}</span>
    ${right}
  </div>`;
}

window.logout = async function(){
  await DB.sb.auth.signOut();
  window.location.href = './auth.html';
};


// ════════════════════════════════════════════════════════════
// VENDER
// ════════════════════════════════════════════════════════════
function cartCount(){ return Object.values(S.cart).reduce((a,b)=>a+b,0); }
function cartSub(){ return Object.entries(S.cart).reduce((a,[id,q])=>{ const p=S.productos.find(x=>x.id===id); return p ? a + p.precio*q : a; },0); }
function discAmt(){ return Math.round(cartSub() * (S.disc/100)); }
function cartTotal(){ return cartSub() - discAmt(); }

function renderVender(){
  const fil = S.productos.filter(p => (S.fcat==='Todos' || p.categoria_id===S.fcat) && p.nombre.toLowerCase().includes(S.fq.toLowerCase()));
  const cnt = cartCount();

  return `<div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <div style="padding:16px var(--sp-4) 10px;background:#fff;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ink-100)">
      ${LOGO_ICO}
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:800;line-height:1.15">${S.negocio.nombre}</div>
        <div style="font-size:11px;color:${MONEY};font-weight:700;display:flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:${MONEY}"></span>Turno abierto</div>
      </div>
      <button onclick="S.sheet='empleado-info';R()" style="width:38px;height:38px;border-radius:50%;background:var(--brand-soft);border:none;font-size:14px;font-weight:800;color:var(--brand)">${(S.empleadoActivo?.nombre||'D').charAt(0).toUpperCase()}</button>
    </div>

    <div style="padding:12px var(--sp-4) 8px;background:#fff">
      <div style="background:var(--ink-100);border-radius:var(--r-sm);padding:12px 14px;display:flex;align-items:center;gap:9px;margin-bottom:10px">
        <i class="ti ti-search" style="color:var(--ink-500);font-size:18px"></i>
        <input id="vd-search" value="${S.fq}" oninput="S.fq=this.value;R()" placeholder="Buscar artículo..." style="background:none;border:none;flex:1;font-size:15px;padding:0">
      </div>
      <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:10px">

window.addToCart = function(pid){
  const p = S.productos.find(x=>x.id===pid);
  if(!p) return;
  const cur = S.cart[pid] || 0;
  if(p.controla_stock && p.stock - cur <= 0) return;
  S.cart = { ...S.cart, [pid]: cur + 1 };
  R();
};
window.adjCart = function(pid, delta){
  const p = S.productos.find(x=>x.id===pid);
  const cur = S.cart[pid] || 0;
  const next = cur + delta;
  if(next <= 0){ const c = {...S.cart}; delete c[pid]; S.cart = c; }
  else { if(delta>0 && p.controla_stock && p.stock - cur <= 0) return; S.cart = {...S.cart, [pid]: next}; }
  R();
};

window.updVuelto = function(){
  const cash = parseFloat(document.getElementById('ck-cash').value) || 0;
  const vuelto = Math.max(0, cash - cartTotal());
  const box = document.getElementById('vuelto-box'); const val = document.getElementById('vuelto-val');
  if(box) box.style.display = vuelto>0?'flex':'none';
  if(val) val.textContent = f$(vuelto);
};

function itemsParaVenta(){

  });
}

async function finalizarVenta(metodoPago, clienteId){
  const { data, error } = await DB.registrarVenta({
    negocioId: S.negocio.id, empleadoId: S.empleadoActivo.id, turnoId: S.turno.id,
    clienteId: clienteId || null,
    subtotal: cartSub(), descuento: discAmt(), total: cartTotal(),
    metodoPago, efectivoRecibido: metodoPago==='efectivo' ? (parseFloat(S.cash)||0) : null,
    nota: S.nota || null, items: itemsParaVenta(),
  });
  if(error){ alert('Error al registrar venta: ' + error.message); return; }

  // Refrescar productos (por el stock descontado)
  S.productos = await DB.listarProductos(S.negocio.id);
  S.lastSale = { total: cartTotal(), items: Object.keys(S.cart).length };
  S.cart = {}; S.disc = 0; S.nota=''; S.cash=''; S.selCliente=null;
  S.sheet = 'success'; S.cstep='metodo';
  R();
}
window.confirmarVentaDirecta = function(){ finalizarVenta(S.pm, null); };
window.confirmarVentaCtaCte = function(){ finalizarVenta('ctacte', S.selCliente); };

  `);
}

      <div style="display:flex;gap:9px">

        ${total>0?`<button class="btn-money" style="flex:1" onclick="S.mesaCobrarSheet=true;S.mesaPM='efectivo';S.mesaCash='';R()">Cobrar</button>`:''}

window.cambiarCantPedido = async function(pid, nuevaCant){

  S.mesaPedidos = await DB.listarPedidosMesa(S.mesaSel);

function sheetAgregarAMesa(){
  const fil = S.productos.filter(p => p.nombre.toLowerCase().includes(S.mesaFq.toLowerCase()));
  return sheetBg(`

window.agregarAMesa = async function(pid){
  const p = S.productos.find(x=>x.id===pid);
  await DB.agregarPedidoMesa(S.mesaSel, S.negocio.id, S.empleadoActivo.id, p);
  await DB.actualizarMesa(S.mesaSel, { estado: 'ocupada', abierta_en: new Date().toISOString() });

function sheetCobrarMesa(total){
  const metodos = [{id:'efectivo',icon:'ti-cash',label:'Efectivo'},{id:'transferencia',icon:'ti-transfer',label:'Transfer.'},{id:'tarjeta',icon:'ti-credit-card',label:'Tarjeta'}];
  const cash = parseFloat(S.mesaCash)||0;
  const vuelto = S.mesaPM==='efectivo' && cash>0 ? Math.max(0,cash-total) : 0;
  return sheetBg(`
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px">
      <span style="font-size:17px;font-weight:800">Cobrar mesa</span>
      <span style="font-size:22px;font-weight:800">${f$(total)}</span>
      <button onclick="S.mesaCobrarSheet=false;R()" style="width:34px;height:34px;background:var(--ink-100);border:none;border-radius:50%"><i class="ti ti-x"></i></button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
      ${metodos.map(m=>`<div onclick="S.mesaPM='${m.id}';R()" style="padding:14px 6px;border-radius:var(--r-md);text-align:center;background:${S.mesaPM===m.id?'var(--brand-soft)':'var(--ink-100)'};border:2px solid ${S.mesaPM===m.id?A:'transparent'}">
        <i class="ti ${m.icon}" style="font-size:21px;color:${S.mesaPM===m.id?A:'var(--ink-700)'};display:block;margin-bottom:5px"></i>
        <span style="font-size:11px;font-weight:700;color:${S.mesaPM===m.id?A:'var(--ink-700)'}">${m.label}</span>

    </div>
    ${S.mesaPM==='efectivo'?`
      <input id="mc-cash" type="text" inputmode="decimal" value="${S.mesaCash}" oninput="S.mesaCash=this.value;R()" placeholder="${total}" style="font-size:20px;font-weight:800;margin-bottom:10px">
      ${vuelto>0?`<div style="background:var(--money-soft);border-radius:var(--r-md);padding:12px 14px;display:flex;justify-content:space-between;margin-bottom:12px"><span style="color:var(--money-deep);font-weight:700;font-size:13px">Vuelto</span><span style="font-size:18px;font-weight:800;color:var(--money-deep)">${f$(vuelto)}</span></div>`:''}
    `:''}
    <button class="btn-money" onclick="confirmarCobroMesa(${total})"><i class="ti ti-check"></i> Confirmar cobro</button>
  `);

window.confirmarCobroMesa = async function(total){
  const items = (S.mesaPedidos||[]).map(p=>({ producto_id: p.producto_id, nombre_producto: p.nombre_producto, precio_unitario: p.precio_unitario, cantidad: p.cantidad }));
  const { error } = await DB.registrarVenta({
    negocioId: S.negocio.id, empleadoId: S.empleadoActivo.id, turnoId: S.turno.id,
    mesaId: S.mesaSel, subtotal: total, descuento: 0, total,
    metodoPago: S.mesaPM, efectivoRecibido: S.mesaPM==='efectivo'?(parseFloat(S.mesaCash)||0):null,
    items,
  });
  if(error){ alert('Error: '+error.message); return; }
  await DB.vaciarPedidosMesa(S.mesaSel);
  await DB.actualizarMesa(S.mesaSel, { estado:'libre', abierta_en: null });
  const m = S.mesas.find(x=>x.id===S.mesaSel); if(m) m.estado='libre';
  S.productos = await DB.listarProductos(S.negocio.id);
  S.mesaCobrarSheet=false; S.mesaSel=null;
  R();
};

async function cargarResumenCaja(){
  const ventas = await DB.listarVentas(S.negocio.id, { turnoId: S.turno.id });
  const total = ventas.reduce((a,v)=>a+v.total,0);
  const efectivo = ventas.filter(v=>v.metodo_pago==='efectivo').reduce((a,v)=>a+v.total,0);
  const el = document.getElementById('caja-resumen');
  if(!el) return;
  el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left">
      <div class="card" style="padding:14px"><div style="font-size:11px;color:var(--ink-500);font-weight:700">Ventas</div><div style="font-size:20px;font-weight:800">${ventas.length}</div></div>
      <div class="card" style="padding:14px"><div style="font-size:11px;color:var(--ink-500);font-weight:700">Total</div><div style="font-size:20px;font-weight:800;color:${A}">${f$(total)}</div></div>
      <div class="card" style="padding:14px;grid-column:1/-1"><div style="font-size:11px;color:var(--ink-500);font-weight:700">Efectivo esperado en caja</div><div style="font-size:22px;font-weight:800;color:${MONEY}">${f$(S.turno.monto_inicial + efectivo)}</div></div>
    </div>`;
  S._efectivoEsperado = S.turno.monto_inicial + efectivo;
}

function sheetCerrarTurno(){
  return sheetBg(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:17px;font-weight:800">Cerrar turno</span>
      <button onclick="S.sheet=null;R()" style="width:34px;height:34px;background:var(--ink-100);border:none;border-radius:50%"><i class="ti ti-x"></i></button>
    </div>
    <div style="background:var(--ink-100);border-radius:var(--r-sm);padding:12px 14px;display:flex;justify-content:space-between;margin-bottom:12px">
      <span style="font-size:13px;color:var(--ink-700);font-weight:600">Efectivo esperado</span><span style="font-size:14px;font-weight:800">${f$(S._efectivoEsperado||0)}</span>
    </div>
    <label class="lbl">Efectivo contado</label>
    <input id="ct-monto" type="text" inputmode="decimal" placeholder="$0" oninput="updDiferencia()" style="font-size:20px;font-weight:800;margin-bottom:10px">
    <div id="dif-box" style="margin-bottom:14px"></div>
    <button class="btn-danger-ghost" onclick="doCerrarTurno()">Confirmar cierre</button>
  `);
}

window.updDiferencia = function(){
  const decl = parseFloat(document.getElementById('ct-monto').value) || 0;
  const dif = decl - (S._efectivoEsperado||0);
  const box = document.getElementById('dif-box');
  box.innerHTML = `<div style="background:${dif>=0?'var(--money-soft)':'var(--warn-soft)'};border-radius:var(--r-sm);padding:11px 13px;display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:700;color:${dif>=0?'var(--money-deep)':'var(--warn)'}">${dif>=0?'Coincide':'Diferencia'}</span><span style="font-size:15px;font-weight:800;color:${dif>=0?'var(--money-deep)':'var(--warn)'}">${dif>=0?'+':''}${f$(dif)}</span></div>`;
};

window.doCerrarTurno = async function(){
  const decl = parseFloat(document.getElementById('ct-monto').value) || 0;
  const dif = decl - (S._efectivoEsperado||0);
  await DB.cerrarTurno(S.turno.id, decl, dif);
  S.turno = null; S.sheet = null;
  R();
};

window.guardarProducto = async function(){
  const f = S.prodForm;
  const nombre = document.getElementById('pf-nombre').value.trim();
  const precio = parseFloat(document.getElementById('pf-precio').value) || 0;
  if(!nombre || !precio){ alert('Completá nombre y precio.'); return; }
  const campos = {
    nombre, precio, emoji: f.emoji, color: f.color, categoria_id: f.categoria_id,
    controla_stock: f.controla_stock,
    stock: f.controla_stock ? (parseFloat(document.getElementById('pf-stock').value)||0) : 0,
    stock_minimo: f.controla_stock ? (parseFloat(document.getElementById('pf-min').value)||5) : 5,
  };
  if(f.id){
    const { data } = await DB.actualizarProducto(f.id, campos);
    S.productos = S.productos.map(p=>p.id===f.id?data:p);
  } else {
    const { data } = await DB.crearProducto(S.negocio.id, campos);
    if(data) S.productos.push(data);
  }
  S.prodForm = null;
  R();
};
window.eliminarProductoUI = async function(pid){
  if(!confirm('¿Eliminar este artículo?')) return;
  await DB.eliminarProducto(pid);
  S.productos = S.productos.filter(p=>p.id!==pid);
  S.prodForm = null;
  R();
};

// ════════════════════════════════════════════════════════════
// CLIENTES
// ════════════════════════════════════════════════════════════
function renderClientesScreen(back){
  if(S.clienteForm) return renderClienteForm(back);
  if(S.clienteSel) return renderClienteDetalle(back);
  return `<div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    ${header('Clientes', { back, right: `<button onclick="S.clienteForm={id:null,nombre:'',telefono:''};R()" style="width:36px;height:36px;border-radius:99px;background:${A};border:none;color:#fff;font-size:17px"><i class="ti ti-plus"></i></button>` })}
    <div style="flex:1;overflow-y:auto;padding:12px var(--sp-4)">
      ${!S.clientes.length?`<div style="text-align:center;padding:40px;color:var(--ink-500)"><i class="ti ti-users" style="font-size:36px;display:block;margin-bottom:10px"></i><p style="font-size:13px">Tocá + para agregar un cliente.</p></div>`
      : S.clientes.map(c=>`<div onclick="verCliente('${c.id}')" class="card" style="display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer">
        <div style="width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:${A};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">${c.nombre.charAt(0).toUpperCase()}</div>
        <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">${c.nombre}</div><div style="font-size:12px;color:var(--ink-500);font-weight:600">${c.telefono||''}</div></div>
        <i class="ti ti-chevron-right" style="color:var(--ink-300)"></i>
      </div>`).join('')}
    </div>
  </div>`;
}

window.verCliente = async function(cid){
  S.clienteSel = cid;
  S.clienteSaldo = await DB.saldoCliente(cid);
  S.clienteMovs = await DB.movimientosCliente(cid);
  R();
};

function renderClienteDetalle(back){
  const c = S.clientes.find(x=>x.id===S.clienteSel);
  const saldo = S.clienteSaldo || 0;
  return `<div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    ${header(c.nombre, { back: "S.clienteSel=null;R()" })}
    <div style="flex:1;overflow-y:auto;padding:14px var(--sp-4)">
      <div style="background:${saldo<0?'var(--danger-soft)':'var(--money-soft)'};border-radius:var(--r-md);padding:15px 16px;margin-bottom:16px">
        <div style="font-size:12px;color:${saldo<0?'var(--danger)':'var(--money-deep)'};font-weight:700">Cuenta corriente</div>
        <div style="font-size:26px;font-weight:800;color:${saldo<0?'var(--danger)':'var(--money-deep)'}">${saldo<0?'−':'+'}${f$(Math.abs(saldo))}</div>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Movimientos</div>
      ${!S.clienteMovs?.length?`<p style="font-size:13px;color:var(--ink-500)">Sin movimientos.</p>`
      :S.clienteMovs.map(m=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ink-100)"><span style="font-size:13px;color:var(--ink-700)">${m.descripcion||m.tipo}</span><span style="font-size:14px;font-weight:700;color:${m.monto>0?'var(--money-deep)':'var(--danger)'}">${m.monto>0?'+':''}${f$(m.monto)}</span></div>`).join('')}
    </div>
  </div>`;
}

function renderClienteForm(back){
  const f = S.clienteForm;
  return `<div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    ${header('Nuevo cliente', { back: "S.clienteForm=null;R()" })}
    <div style="flex:1;overflow-y:auto;padding:14px var(--sp-4)">
      <div class="field"><label class="lbl">Nombre *</label><input id="cf-nombre" value="${f.nombre}" oninput="S.clienteForm.nombre=this.value" placeholder="Nombre completo"></div>
      <div class="field"><label class="lbl">Teléfono</label><input id="cf-tel" value="${f.telefono}" oninput="S.clienteForm.telefono=this.value" placeholder="3757-..."></div>
      <button class="btn-primary" onclick="guardarCliente()">Agregar cliente</button>
    </div>
  </div>`;
}
window.guardarCliente = async function(){
  const nombre = document.getElementById('cf-nombre').value.trim();
  if(!nombre){ alert('Ingresá un nombre.'); return; }
  const telefono = document.getElementById('cf-tel').value.trim();
  const { data } = await DB.crearCliente(S.negocio.id, { nombre, telefono });
  if(data) S.clientes.push(data);
  S.clienteForm = null;
  R();
};

// ════════════════════════════════════════════════════════════
// EMPLEADOS
// ════════════════════════════════════════════════════════════
function renderEmpleadosScreen(back){
  if(S.empForm) return renderEmpForm(back);
  return `<div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    ${header('Empleados', { back, right: `<button onclick="S.empForm={nombre:'',pin:'',rol:'cajero'};R()" style="width:36px;height:36px;border-radius:99px;background:${A};border:none;color:#fff;font-size:17px"><i class="ti ti-plus"></i></button>` })}
    <div style="flex:1;overflow-y:auto;padding:12px var(--sp-4)">
      ${!S.empleados.length?`<div style="text-align:center;padding:40px;color:var(--ink-500)"><i class="ti ti-users" style="font-size:36px;display:block;margin-bottom:10px"></i><p style="font-size:13px">Tocá + para agregar empleados con acceso por PIN.</p></div>`
      :S.empleados.map(e=>`<div class="card" style="display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:9px">
        <div style="width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:${A};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800">${e.nombre.charAt(0).toUpperCase()}</div>
        <div style="flex:1"><div style="font-size:15px;font-weight:700">${e.nombre}</div><div style="font-size:12px;color:var(--ink-500);font-weight:600">${rolLabel(e.rol)}</div></div>
        <button onclick="eliminarEmpleadoUI('${e.id}')" style="background:none;border:none;color:var(--danger);font-size:18px"><i class="ti ti-trash"></i></button>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderEmpForm(back){
  const f = S.empForm;
  const roles = [['cajero','Cajero','Vende y cobra'],['mesero','Mesero','Solo toma pedidos']];
  return `<div style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    ${header('Nuevo empleado', { back: "S.empForm=null;R()" })}
    <div style="flex:1;overflow-y:auto;padding:14px var(--sp-4)">
      <div class="field"><label class="lbl">Nombre *</label><input id="ef-nombre" value="${f.nombre}" oninput="S.empForm.nombre=this.value" placeholder="Nombre"></div>
      <div class="field"><label class="lbl">PIN de 4 dígitos *</label><input id="ef-pin" type="text" inputmode="numeric" maxlength="4" value="${f.pin}" oninput="S.empForm.pin=this.value" placeholder="1234" style="font-size:20px;font-weight:700;letter-spacing:4px"></div>
      <label class="lbl" style="margin-bottom:8px">Rol</label>
      ${roles.map(([id,l,d])=>`<div onclick="S.empForm.rol='${id}';R()" style="display:flex;align-items:center;gap:11px;padding:13px;border-radius:var(--r-md);border:2px solid ${f.rol===id?A:'var(--ink-100)'};background:${f.rol===id?'var(--brand-soft)':'#fff'};margin-bottom:8px;cursor:pointer">
        <div style="flex:1"><div style="font-size:14px;font-weight:700;color:${f.rol===id?'var(--brand-deep)':'var(--ink-900)'}">${l}</div><div style="font-size:12px;color:var(--ink-500)">${d}</div></div>
        ${f.rol===id?`<i class="ti ti-check" style="color:${A}"></i>`:''}
      </div>`).join('')}
      <button class="btn-primary" style="margin-top:10px" onclick="guardarEmpleado()">Agregar empleado</button>
    </div>
  </div>`;
}
window.guardarEmpleado = async function(){
  const nombre = document.getElementById('ef-nombre').value.trim();
  const pin = document.getElementById('ef-pin').value.trim();
  if(!nombre || pin.length!==4){ alert('Completá nombre y un PIN de 4 dígitos.'); return; }
  const { data, error } = await DB.crearEmpleado(S.negocio.id, nombre, pin, S.empForm.rol);
  if(error){ alert('Error: '+error.message); return; }
  S.empleados = await DB.listarEmpleados(S.negocio.id);
  S.empForm = null;
  R();
};
window.eliminarEmpleadoUI = async function(eid){
  if(!confirm('¿Eliminar este empleado?')) return;
  await DB.eliminarEmpleado(eid);
  S.empleados = S.empleados.filter(e=>e.id!==eid);
  R();
};

// ════════════════════════════════════════════════════════════
// HOOKS POST-RENDER
// ════════════════════════════════════════════════════════════
function afterRender(){
  if(S.tab === 'caja' && S.turno && !S.prodForm) cargarResumenCaja();
}
</script>
</body>
</html>
